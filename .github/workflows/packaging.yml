name: Multi-Platform Release Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

env:
  SQLX_OFFLINE: 'true'
  VITE_ENVIRONMENT_TYPE: 'production'

jobs:
  # 1. Linux Packaging (.deb / .AppImage via tauri-action)
  package-linux:
    name: Linux (deb / AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx nx run artcraft:build
      - name: Disable beforeBuildCommand (frontend already built)
        working-directory: crates/desktop/artcraft
        run: |
          cp tauri.conf.json tauri.conf.json.bak
          jq '.build.beforeBuildCommand = ""' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./crates/desktop/artcraft
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tauri-bundles
          path: crates/desktop/artcraft/target/release/bundle/**

  # 2. macOS Packaging (Universal .dmg via tauri-action)
  package-macos:
    name: macOS (Universal .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx nx run artcraft:build
      - name: Select macOS Tauri config and disable beforeBuildCommand
        working-directory: crates/desktop/artcraft
        run: |
          cp tauri-mac.conf.json tauri.conf.json
          jq '.build.beforeBuildCommand = ""' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./crates/desktop/artcraft
          args: --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: crates/desktop/artcraft/target/universal-apple-darwin/release/bundle/**

  # 3. Windows Packaging (.msi / .exe via tauri-action)
  package-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: cmd
        run: |
          choco install cmake -y
          choco install strawberryperl -y
          choco install pkgconfiglite -y
          choco install llvm -y
          choco install nasm -y
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          $env:NODE_OPTIONS="--max-old-space-size=8192"
          npx nx run artcraft:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Disable beforeBuildCommand (frontend already built)
        working-directory: crates/desktop/artcraft
        shell: pwsh
        run: |
          Copy-Item tauri.conf.json tauri.conf.json.bak
          $config = Get-Content tauri.conf.json | ConvertFrom-Json
          $config.build.beforeBuildCommand = ""
          $config | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./crates/desktop/artcraft
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: crates/desktop/artcraft/target/release/bundle/**
